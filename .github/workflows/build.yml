name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners ship with the Android SDK preinstalled.
      - name: Install NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.0.12077973" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.HERMES_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hermes.jks"
            echo "HERMES_KEYSTORE_FILE=$RUNNER_TEMP/hermes.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::HERMES_KEYSTORE_BASE64 secret not set; release APK is signed with a throwaway debug key."
          fi

      - name: Build release APKs
        env:
          HERMES_KEYSTORE_PASSWORD: ${{ secrets.HERMES_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleNonRoot_gameRelease 2>&1 | tee build.log
      - name: Surface build errors as annotations
        if: failure()
        run: |
          grep -E "error:|e: |FAILED|What went wrong|Exception|> " build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done || true

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-apks
          path: out/*.apk
          if-no-files-found: error

      - name: Publish rolling "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: true
          body: "Automatic build of ${{ github.sha }}. Most phones (including Pixel) want the **arm64-v8a** APK."
          files: out/*.apk

    permissions:
      contents: write
